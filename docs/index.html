<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>최면 앱 홍보 관리</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="shell">
    <header><span class="eyebrow">HYPNOSIS · PROMOTION</span><h1>최면 앱 홍보 관리</h1><p>내용을 저장하면 앱에서 다음 최면 화면 진입 시 확인합니다.</p></header>
    <section class="card">
      <h2>GitHub 연결</h2>
      <p class="help">이 저장소에만 <strong>Contents: Read and write</strong> 권한을 준 Fine-grained personal access token을 입력하세요. 토큰은 브라우저에 저장되지 않습니다.</p>
      <label for="token">GitHub 토큰</label>
      <div class="token-row"><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><button id="load" type="button" class="secondary">불러오기</button></div>
    </section>
    <section class="card">
      <div class="heading"><h2>팝업 내용</h2><label class="switch"><input id="enabled" type="checkbox"><span>팝업 켜기</span></label></div>
      <label for="image">대표 이미지 <small>JPG · PNG · WebP, 최대 3MB</small></label>
      <div class="preview"><img id="preview" alt="등록한 홍보 이미지" hidden><span id="empty-preview">이미지를 선택해 주세요</span></div>
      <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
      <label for="title">제목</label><input id="title" type="text" maxlength="80" placeholder="새로운 앱을 만나보세요">
      <label for="buttonLabel">버튼 문구</label><input id="buttonLabel" type="text" maxlength="24" value="보러가기">
      <label for="linkUrl">이동 주소</label><input id="linkUrl" type="url" inputmode="url" placeholder="https://example.com">
      <button id="save" type="button" class="primary">저장하기</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <p class="foot">저장 후 GitHub Pages가 새 파일을 게시하기까지 잠시 걸릴 수 있습니다. 팝업을 끄려면 스위치를 끄고 저장하세요.</p>
  </main>
</body>
</html>
